title: Body
views:
- title: Body
  path: body
  icon: mdi:scale-bathroom
  type: sections
  max_columns: 2
  dense_section_placement: true
  badges: []
  sections:
  - cards:
    - type: vertical-stack
      id: gluroo-body-overview
      cards:
      - type: heading
        heading: Gluroo glucose
        icon: mdi:water-drop
      - type: grid
        columns: 4
        square: false
        cards:
        - type: tile
          entity: sensor.gluroo_blood_glucose
          name: Glucose
          icon: mdi:water-drop
          color: red
          vertical: true
        - type: tile
          entity: sensor.gluroo_glucose_trend
          name: Trend
          icon: mdi:trending-down
          color: deep-orange
          vertical: true
        - type: tile
          entity: sensor.gluroo_glucose_delta
          name: Delta
          icon: mdi:delta
          color: amber
          vertical: true
        - type: tile
          entity: sensor.gluroo_glucose_reading_age
          name: Age
          icon: mdi:clock-outline
          color: blue
          vertical: true
      - type: grid
        columns: 2
        square: false
        cards:
        - type: sensor
          entity: sensor.gluroo_blood_glucose
          name: Glucose · 3 hours
          graph: line
          hours_to_show: 3
          detail: 1
        - type: history-graph
          title: Trend · 3 hours
          entities:
          - sensor.gluroo_glucose_trend
          hours_to_show: 3
          show_names: false
        - type: sensor
          entity: sensor.gluroo_glucose_delta
          name: Delta · 3 hours
          graph: line
          hours_to_show: 3
          detail: 1
        - type: sensor
          entity: sensor.gluroo_glucose_reading_age
          name: Age · 3 hours
          graph: line
          hours_to_show: 3
          detail: 1
  - cards:
    - type: vertical-stack
      cards:
      - type: picture-elements
        image: /local/ge_fit_plus_ln_health_hero.svg
        elements:
        - type: image
          image: /local/ge_fit_plus_ln_body_male.png
          style:
            left: 25%
            top: 50%
            width: 29%
            opacity: 0.78
            filter: drop-shadow(0 6px 18px rgba(0,0,0,.35))
        - type: state-label
          entity: sensor.ge_fit_plus_ln_weight_lb
          style:
            left: 70%
            top: 37%
            color: '#fff8ed'
            font-size: 3.6em
            font-weight: 700
            letter-spacing: -0.04em
            text-shadow: 0 2px 18px rgba(0,0,0,.55)
        - type: state-label
          entity: sensor.ge_fit_plus_ln_body_fat
          style:
            left: 70%
            top: 58%
            color: '#f3c887'
            font-size: 1.35em
            font-weight: 600
            letter-spacing: .02em
            text-shadow: 0 2px 12px rgba(0,0,0,.55)
        - type: state-label
          entity: sensor.ge_fit_plus_ln_measurement_id
          style:
            left: 70%
            top: 77%
            color: '#c3d8cf'
            font-size: .72em
            font-weight: 500
            opacity: 0.92
            text-shadow: 0 1px 8px rgba(0,0,0,.65)
      - type: grid
        columns: 3
        square: false
        cards:
        - type: tile
          entity: sensor.ge_fit_plus_ln_weight_lb
          name: Weight (lb)
          icon: mdi:scale-bathroom
          color: amber
          vertical: true
        - type: tile
          entity: sensor.ge_fit_plus_ln_body_fat
          name: Body fat
          icon: mdi:human
          color: deep-orange
          vertical: true
        - type: tile
          entity: sensor.ge_fit_plus_ln_bmi
          name: BMI
          icon: mdi:chart-bell-curve-cumulative
          color: teal
          vertical: true
      - type: grid
        columns: 2
        square: false
        cards:
        - type: gauge
          entity: sensor.ge_fit_plus_ln_body_fat
          name: Body fat
          unit: '%'
          min: 3
          max: 60
          needle: true
          severity:
            green: 10
            yellow: 22
            red: 30
        - type: gauge
          entity: sensor.ge_fit_plus_ln_bmi
          name: BMI
          min: 10
          max: 40
          needle: true
          severity:
            green: 18.5
            yellow: 25
            red: 30
  - cards:
    - type: grid
      columns: 2
      square: false
      cards:
      - type: statistics-graph
        title: Weight · 30 days (lb)
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
        - mean
        - min
        - max
        entities:
        - sensor.ge_fit_plus_ln_weight_lb
      - type: statistics-graph
        title: Body fat · 30 days
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
        - mean
        - min
        - max
        entities:
        - sensor.ge_fit_plus_ln_body_fat
  - cards:
    - type: grid
      columns: 2
      square: false
      cards:
      - type: entities
        title: Composition
        show_header_toggle: false
        entities:
        - entity: sensor.ge_fit_plus_ln_body_water
          name: Body water
        - entity: sensor.ge_fit_plus_ln_protein
          name: Protein
        - entity: sensor.ge_fit_plus_ln_muscle_mass
          name: Muscle mass
        - entity: sensor.ge_fit_plus_ln_skeletal_muscle
          name: Skeletal muscle
        - entity: sensor.ge_fit_plus_ln_bone_mass
          name: Bone mass
        - entity: sensor.ge_fit_plus_ln_fat_free_mass_lb
          name: Fat-free mass (lb)
      - type: entities
        title: Sync status
        show_header_toggle: false
        entities:
        - entity: automation.ge_fit_plus_ln_write_google_health
          name: Google Health automation
          secondary_info: last-triggered
        - entity: sensor.ge_fit_plus_ln_measurement_id
          name: Latest measurement
          secondary_info: last-changed
        - entity: sensor.ge_fit_plus_ln_weight_lb
          name: Latest weight (lb)
          secondary_info: last-changed
        - entity: sensor.ge_fit_plus_ln_body_fat
          name: Latest body fat
          secondary_info: last-changed
- title: Setup
  path: setup
  icon: mdi:tune-variant
  badges: []
  cards:
  - type: markdown
    content: '## Scale setup

      Configure the profile and sync behavior once, then return to **Body** for the
      monitor view.


      [Open Scale Sync settings](/config/integrations/integration/google_health_scale_sync)


      The setup form stores height, age, sex, optional birth date, and body-fat sync
      preference locally in Home Assistant. Google authorization remains limited to
      the write scope required for measurements.

      '
  - type: entities
    title: Runtime checks
    show_header_toggle: false
    entities:
    - entity: automation.ge_fit_plus_ln_write_google_health
      name: Google Health automation
      secondary_info: last-triggered
    - entity: sensor.ge_fit_plus_ln_measurement_id
      name: Latest measurement
      secondary_info: last-changed
    - entity: sensor.ge_fit_plus_ln_weight_lb
      name: Weight (lb) publisher
      secondary_info: last-changed
    - entity: sensor.ge_fit_plus_ln_body_fat
      name: Body-fat publisher
      secondary_info: last-changed
  - type: markdown
    content: '### Figure overlay

      The Body view ships with a masculine scan figure. The HACS package also includes
      a feminine variant at `www/ge_fit_plus_ln_body_female.png`; swap the image reference
      in the dashboard YAML when needed.


      The figure is an anonymous visualization only; measured values always come from
      the scale entities.

      '
