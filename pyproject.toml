[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haos-google-health-api-scale-sync"
version = "0.1.0"
description = "Self-hosted Home Assistant to Google Health API body-measurement sync"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rgnv" }]
dependencies = [
  "google-auth>=2.30,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
google-health-scale-sync = "ha_google_health_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
